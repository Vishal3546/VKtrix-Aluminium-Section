<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Job Card</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; color: #333; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { margin: 0; text-transform: uppercase; }
        .details { width: 100%; margin-bottom: 20px; }
        .details td { padding: 5px; }
        .table-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .cut-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .cut-table th, .cut-table td { border: 1px solid #999; padding: 8px; text-align: center; }
        .cut-table th { background-color: #f2f2f2; }
        .drawing-placeholder { width: 100%; height: 200px; border: 2px dashed #ccc; display: table; margin-bottom: 20px; }
        .drawing-placeholder span { display: table-cell; vertical-align: middle; text-align: center; color: #999; }
        .footer { margin-top: 50px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="header">
    <h1>Production Job Card</h1>
</div>

<table class="details">
    <tr>
        <td><strong>Job Card No:</strong> <span th:text="${jobCardNumber}">JC-1000</span></td>
        <td><strong>Sales Order ID:</strong> <span th:text="${salesOrderId}">SO-1234</span></td>
    </tr>
    <tr>
        <td><strong>Current Stage:</strong> <span th:text="${stage}">PENDING</span></td>
        <td><strong>Assigned Worker:</strong> <span th:text="${worker}">Not Assigned</span></td>
    </tr>
</table>

<div class="table-title">Panel Drawings</div>
<div class="drawing-placeholder">
    <span>(2D Drawing Placeholder - Refer to System Canvas)</span>
</div>

<div class="table-title">Cutting Requirements</div>
<table class="cut-table">
    <thead>
    <tr>
        <th>Profile System</th>
        <th>Color</th>
        <th>Cut Length (mm)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cut : ${cuts}">
        <td th:text="${cut.profileType}">SERIES-500</td>
        <td th:text="${cut.color}">POWDER COATED BLACK</td>
        <td th:text="${cut.lengthMm}">1250.0</td>
    </tr>
    </tbody>
</table>

<div class="footer">
    Print Date: <span th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm')}"></span>
</div>

</body>
</html>
