spring:
  datasource:
    # Supavisor session-mode connection string for staging
    url: jdbc:postgresql://aws-0-REGION.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.[PROJECT-REF]
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://[PROJECT-REF].supabase.co/auth/v1
          jwk-set-uri: https://[PROJECT-REF].supabase.co/auth/v1/.well-known/jwks.json
